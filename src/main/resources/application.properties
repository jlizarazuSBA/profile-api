spring.application.name=profile-api

# SAM.gov registration integration — disabled by default
sam.enabled=${SAM_ENABLED:false}
sam.base-url=${SAM_BASE_URL:https://api.sam.gov}
sam.api-key=${SAM_API_KEY:}

# Proposed timeout defaults
sam.connect-timeout=3s
sam.read-timeout=10s

usaspending.enabled=${USASPENDING_ENABLED:false}
usaspending.base-url=https://api.usaspending.gov
usaspending.connect-timeout=3s
usaspending.read-timeout=10s
usaspending.lookback-years=5
usaspending.result-limit=5